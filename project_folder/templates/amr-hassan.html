<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة تحفيزية - Head AI AMR HASSAN</title>
    <style>
        body {
            background: linear-gradient(100deg, #1e3c72, #2a5298);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            position: relative;
            min-height: 80vh;
        }
        .motivation-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        .back-btn {
            background: #fff;
            color: #1e3c72;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
        /* التعديل الجديد */
        .signature {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            opacity: 0.7; /* شفافية */
            font-size: 1rem;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="motivation-card">
        <h1>🎉تم تسجيل حضورك بنجاح</h1>
        <p>"النجاح ليس محطة وصول، بل رحلة مستمرة. استمر في التعلم وستصل إلى القمة!"</p>
        <a href="/" class="back-btn">العودة إلى الصفحة الرئيسية</a>
    </div>

    <!-- التوقيع في الأسفل -->
    <div class="signature">
        <h2>Head AI AMR HASSAN</h2>
    </div>
</body>
</html>
